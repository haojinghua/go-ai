<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>围棋 AI 对弈 &amp; 分析</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 1.8em; margin-bottom: 10px; color: #e0d5b0; }
        .container {
            display: flex; gap: 30px; align-items: flex-start;
            flex-wrap: wrap; justify-content: center;
        }
        .board-wrapper { position: relative; }
        #board-canvas {
            cursor: crosshair; border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .panel {
            background: #16213e; border-radius: 12px; padding: 20px;
            min-width: 340px; max-width: 640px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        /* 两栏布局：设置区与按钮区（免滚动一屏展示全部功能） */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-grid .btn { margin-bottom: 0; }
        .panel h3 { color: #e0d5b0; margin-bottom: 15px; font-size: 1.1em; }
        .btn {
            display: block; width: 100%; padding: 10px 16px; margin-bottom: 8px;
            border: none; border-radius: 6px; font-size: 0.95em;
            cursor: pointer; transition: all 0.2s; font-weight: 500;
        }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-primary:hover { background: #5aa0e9; }
        .btn-secondary { background: #3a3a5c; color: #ccc; }
        .btn-secondary:hover { background: #4a4a7c; }
        .btn-danger { background: #d94a4a; color: white; }
        .btn-danger:hover { background: #e95a5a; }
        .btn-success { background: #2a9d6a; color: white; }
        .btn-success:hover { background: #3ab; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 15px; padding: 10px; background: #0f3460;
            border-radius: 6px; font-size: 0.9em; line-height: 1.6;
        }
        .thinking { color: #ffd700; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .move-history {
            margin-top: 15px; max-height: 200px; overflow-y: auto;
            font-size: 0.85em; color: #aaa;
        }
        .settings { margin-bottom: 15px; }
        .settings label { display: block; margin-bottom: 5px; font-size: 0.85em; color: #999; }
        .settings select, .settings input {
            width: 100%; padding: 6px 10px; border-radius: 4px;
            border: 1px solid #3a3a5c; background: #1a1a2e; color: #eee; margin-bottom: 10px;
        }
        /* Tabs */
        .tabs { display: flex; margin-bottom: 15px; border-radius: 6px; overflow: hidden; border: 1px solid #3a3a5c; }
        .tab-btn {
            flex: 1; padding: 9px 12px; text-align: center; cursor: pointer;
            font-size: 0.9em; background: #1a1a2e; color: #888;
            transition: all 0.2s; border: none; font-weight: 500;
        }
        .tab-btn.active { background: #4a90d9; color: white; }
        .tab-btn:hover:not(.active) { background: #2a2a4e; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        /* Paste zone */
        .paste-zone {
            border: 2px dashed #3a3a5c; border-radius: 8px; padding: 15px;
            text-align: center; color: #666; font-size: 0.9em; margin-bottom: 12px;
            cursor: pointer; transition: all 0.2s; min-height: 60px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .paste-zone:hover { border-color: #4a90d9; color: #4a90d9; }
        .paste-zone.has-img { border-color: #2a9d6a; padding: 6px; }
        .paste-zone img { max-width: 100%; max-height: 120px; border-radius: 4px; }
        .paste-hint { font-size: 0.75em; margin-top: 4px; color: #555; }
        /* 历史对局弹窗 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            z-index: 100; align-items: center; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #16213e; border-radius: 12px; padding: 20px; width: 420px;
            max-height: 75vh; display: flex; flex-direction: column;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        .modal h3 { color: #e0d5b0; margin-bottom: 12px; }
        .game-list { overflow-y: auto; flex: 1; }
        .game-item {
            display: flex; align-items: center; gap: 8px; padding: 10px;
            border: 1px solid #2a2a4e; border-radius: 8px; margin-bottom: 8px;
            font-size: 0.85em;
        }
        .game-item:hover { border-color: #4a90d9; }
        .game-item .gi-info { flex: 1; line-height: 1.5; }
        .game-item .gi-name { color: #e0d5b0; font-weight: 500; }
        .game-item .gi-meta { color: #888; font-size: 0.9em; }
        .game-item .gi-actions { display: flex; gap: 6px; }
        .mini-btn {
            padding: 5px 12px; border: none; border-radius: 5px; cursor: pointer;
            font-size: 0.9em; font-weight: 500;
        }
        .mini-btn.load { background: #2a9d6a; color: white; }
        .mini-btn.load:hover { background: #3ab; }
        .mini-btn.del { background: #3a3a5c; color: #ccc; }
        .mini-btn.del:hover { background: #d94a4a; color: white; }
        /* 胜率曲线弹窗 */
        .winrate-modal { width: 720px; }
        .winrate-canvas-wrap { position: relative; }
        #winrate-canvas { width: 100%; background: #0d1326; border-radius: 6px; cursor: crosshair; display: block; }
        .wr-tip {
            position: absolute; pointer-events: none; background: #1c2749; color: #e0e0e0;
            padding: 6px 10px; border-radius: 6px; font-size: 0.78em; white-space: nowrap;
            border: 1px solid #3a4a7a; display: none; z-index: 10;
        }
        .wr-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 0.82em; color: #999; align-items: center; }
        .wr-legend .sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
    </style>
</head>
<body>
    <h1>围棋 AI 对弈 &amp; 分析</h1>
    <p style="margin-bottom:20px;color:#888;">KataGo 引擎 - 本地运行</p>

    <!-- 历史对局弹窗 -->
    <div class="modal-overlay" id="games-modal">
        <div class="modal">
            <h3>历史对局</h3>
            <div class="game-list" id="game-list"></div>
            <button class="btn btn-secondary" onclick="closeGamesModal()" style="margin-top:12px;">关闭</button>
        </div>
    </div>

    <!-- AI 讲解弹窗 -->
    <div class="modal-overlay" id="explain-modal">
        <div class="modal" style="max-width:560px;">
            <h3>💡 AI 局面讲解</h3>
            <div id="explain-body" style="line-height:1.8;font-size:0.98em;overflow-y:auto;"></div>
            <button class="btn btn-secondary" onclick="closeExplainModal()" style="margin-top:12px;align-self:flex-start;">关闭</button>
        </div>
    </div>

    <!-- 胜率曲线弹窗 -->
    <div class="modal-overlay" id="winrate-modal">
        <div class="modal winrate-modal">
            <h3>📈 全局胜率曲线</h3>
            <div class="winrate-canvas-wrap">
                <canvas id="winrate-canvas" width="680" height="320"></canvas>
                <div class="wr-tip" id="wr-tip"></div>
            </div>
            <div class="wr-legend">
                <span><span class="sw" style="background:#4a9d6a;"></span>胜率（黑方视角，%）</span>
                <span><span class="sw" style="background:#d9a04a;"></span>目差</span>
                <span style="margin-left:auto;">点击曲线跳转到对应局面</span>
                <label style="cursor:pointer;color:#bbb;"><input type="checkbox" id="wr-show-score" onchange="drawWinrateChart()"> 显示目差</label>
            </div>
            <div style="margin-top:8px;font-size:0.82em;color:#888;" id="wr-summary"></div>
            <button class="btn btn-secondary" onclick="closeWinrateModal()" style="margin-top:12px;align-self:flex-start;">关闭</button>
        </div>
    </div>

    <div class="container">
        <div class="board-wrapper">
            <canvas id="board-canvas" width="620" height="620"></canvas>
        </div>

        <div class="panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="play">对弈</button>
                <button class="tab-btn" data-tab="analyze">局面分析</button>
            </div>

            <!-- Play tab -->
            <div id="pane-play" class="tab-pane active">
                <div class="settings settings-grid">
                    <div>
                        <label>棋盘大小</label>
                        <select id="board-size">
                            <option value="19" selected>19x19</option>
                            <option value="13">13x13</option>
                            <option value="9">9x9</option>
                        </select>
                    </div>
                    <div>
                        <label>你的颜色</label>
                        <select id="player-color">
                            <option value="B" selected>黑棋(先手)</option>
                            <option value="W">白棋(后手)</option>
                        </select>
                    </div>
                    <div style="grid-column: span 2;">
                        <label>AI 强度</label>
                        <select id="ai-strength">
                            <option value="100">入门 (100 visits)</option>
                            <option value="400">弱 (400 visits)</option>
                            <option value="1600" selected>中等 (1600 visits)</option>
                            <option value="5000">强 (5000 visits)</option>
                            <option value="10000">最强 (10000 visits)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-grid">
                    <button class="btn btn-primary" onclick="newGame()">新对局</button>
                    <button class="btn btn-secondary" onclick="undoMove()">悔棋</button>
                    <button class="btn btn-secondary" onclick="requestHint()">提示</button>
                    <button class="btn btn-secondary" onclick="passMove()">跳过 (Pass)</button>
                    <button class="btn btn-danger" onclick="resignGame()">认输</button>
                    <button class="btn btn-secondary" onclick="exportSGF()">导出棋谱 (SGF)</button>
                    <button class="btn btn-secondary" onclick="saveCurrentGame()">保存对局</button>
                    <button class="btn btn-secondary" onclick="showGamesModal()">历史对局</button>
                </div>
                <div class="status" id="status">点击「新对局」开始</div>
                <div class="move-history" id="move-history"></div>
            </div>

            <!-- Analyze tab -->
            <div id="pane-analyze" class="tab-pane">
                <div class="paste-zone" id="paste-zone" onclick="document.getElementById('file-upload').click()">
                    <span id="paste-label">Ctrl+V 粘贴截图 / 点击上传图片</span>
                    <span class="paste-hint" id="paste-hint">支持截图粘贴、拖拽、文件上传</span>
                    <img id="paste-thumb" style="display:none">
                    <input type="file" id="file-upload" accept="image/*" style="display:none" onchange="handleFileUpload(event)">
                </div>


                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                    <button class="btn btn-secondary" onclick="analyzeMoveBack()" title="后退一手" style="padding:4px 12px;font-size:1.1em;">⬅</button>
                    <span id="move-index-display" style="font-size:0.85em;color:#aaa;">0/0</span>
                    <button class="btn btn-secondary" onclick="analyzeMoveForward()" title="前进一手" style="padding:4px 12px;font-size:1.1em;">➡</button>
                    <span class="info" id="stone-count" style="margin-left:auto;font-size:0.8em;color:#888;">黑 0 白 0</span>
                </div>

                <div class="settings settings-grid" id="next-player-section">
                    <div>
                        <label>轮到谁走</label>
                        <select id="next-player" onchange="onNextPlayerChange()">
                            <option value="B" selected>黑方</option>
                            <option value="W">白方</option>
                        </select>
                    </div>
                    <div>
                        <label>AI 强度</label>
                        <select id="analyze-strength">
                            <option value="100">入门 (100 visits)</option>
                            <option value="400" selected>弱 (400 visits)</option>
                            <option value="1600">中等 (1600 visits)</option>
                            <option value="5000">强 (5000 visits)</option>
                            <option value="10000">最强 (10000 visits)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-grid">
                    <button class="btn btn-success" onclick="runAnalysis()" id="btn-analyze">AI 分析</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('sgf-upload').click()">导入 SGF 棋谱</button>
                    <input type="file" id="sgf-upload" accept=".sgf,application/x-go-sgf,text/plain" style="display:none" onchange="handleSgfUpload(event)">
                    <button class="btn btn-secondary" onclick="showWinrateChart()" id="btn-winrate" title="整局逐手胜率分析，点击曲线跳转局面">📈 胜率曲线</button>
                    <button class="btn btn-secondary" onclick="explainPosition()" id="btn-explain" title="AI 用自然语言讲解当前局面：形势判断、推荐意图、下一步建议">💡 AI 讲解</button>
                    <button class="btn btn-secondary" onclick="toggleGroupLife()" id="btn-grouplife" title="开启后点击棋盘上任意棋子，AI 判断该棋块是活是死，并给出急救要点（不落子）">❤️‍🩹 死活提示</button>
                </div>
                <label style="display:flex;align-items:center;gap:6px;margin-top:10px;font-size:0.85em;color:#aaa;cursor:pointer;">
<input type="checkbox" id="show-move-numbers" onchange="toggleMoveNumbers(this.checked)"> 显示落子序号
</label>

                <div class="status" id="analyze-status">摆好局面后点击分析</div>
            </div>
        </div>
    </div>

<script>
// ==============================================================
// 全局变量
// ==============================================================
var canvas = document.getElementById('board-canvas');
var ctx = canvas.getContext('2d');

var currentTab = 'play';
var boardSize = 19;
var margin = 30;
var cellSize = 0;

// 对弈
var playerColor = 'B';
var aiColor = 'W';
var board = [];
var moveHistory = [];
var lastMove = null;
var gameActive = false;
var thinking = false;

// 分析
var analyzeBoard = [];
var analyzeBaseBoard = [];    // 基础棋盘（图片识别或空板）
var analyzeResults = [];
var isAnalyzing = false;
var hoveredPVIndex = -1; // 当前悬停的推荐走法索引（-1表示没有悬停）
var pinnedPVIndex = -1;  // 点击固定的 PV 展开索引（-1表示没有固定；与 hover 互斥）
// 辅助：清空固定 PV（分析重跑/局面变化/切 Tab/浏览手数时调用）
function clearPinnedPV() { pinnedPVIndex = -1; }
var PV_MAX_SHOW = 12;    // PV 变化图最多展示的手数
var showMoveNumbers = false; // 是否显示落子序号（默认不显示）
var analyzeNextColor = 'B';   // 分析模式下一手颜色
var analyzeKomi = 6.5;        // 分析模式贴目（可由 SGF 导入覆盖）
var analyzeLastMove = null;   // 分析模式最后一手位置
var analyzeMoveHistory = [];  // 分析模式落子历史
var analyzeMoveIndex = 0;     // 当前浏览位置（显示到第几手）

// 对弈模式推荐
var playRecommendations = [];
var PLAY_REC_COLORS = ['#1B5E20','#4CAF50','#A5D6A7']; // 深绿到浅绿

var COLS = 'ABCDEFGHJKLMNOPQRST';
var RANK_COLORS = ['#1B5E20','#2E7D32','#4CAF50','#81C784','#A5D6A7']; // 深绿到浅绿（胜率高→深）

// ==============================================================
// 工具函数
// ==============================================================
function calcDraw() { cellSize = (canvas.width - 2*margin) / (boardSize - 1); }

function pixelToBoard(px, py) {
    var col = Math.round((px - margin) / cellSize);
    var row = Math.round((py - margin) / cellSize);
    if (row >= 0 && row < boardSize && col >= 0 && col < boardSize) return [row, col];
    return null;
}
function boardToGTP(r, c) { return COLS[c] + String(boardSize - r); }
function gtpToBoard(gtp) {
    if (!gtp || gtp.toLowerCase()==='pass' || gtp.toLowerCase()==='resign') return null;
    var c = COLS.indexOf(gtp[0].toUpperCase());
    var r = boardSize - parseInt(gtp.slice(1));
    if (c < 0 || r < 0 || r >= boardSize) return null;
    return [r, c];
}

function getGroup(r, c, brd, vis) {
    vis = vis || {};
    var k = r+','+c;
    if (vis[k]) return {stones:[], libs:0};
    vis[k] = true;
    var clr = brd[r][c];
    if (clr === 0) return {stones:[], libs:0};
    var stones = [[r,c]], libs = 0;
    var nb = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for (var i = 0; i < nb.length; i++) {
        var nr = nb[i][0], nc = nb[i][1];
        if (nr<0||nr>=boardSize||nc<0||nc>=boardSize) continue;
        var nk = nr+','+nc;
        if (vis[nk]) continue;
        if (brd[nr][nc]===0) { libs++; vis[nk]=true; }
        else if (brd[nr][nc]===clr) {
            var sub = getGroup(nr, nc, brd, vis);
            stones = stones.concat(sub.stones); libs += sub.libs;
        }
    }
    return {stones:stones, libs:libs};
}
function removeCaptures(r, c, placed, brd) {
    var opp = placed===1?2:1;
    var nb = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    var capturedList = [];
    for (var i = 0; i < nb.length; i++) {
        var nr = nb[i][0], nc = nb[i][1];
        if (nr<0||nr>=boardSize||nc<0||nc>=boardSize) continue;
        if (brd[nr][nc]===opp) {
            var g = getGroup(nr, nc, brd);
            if (g.libs===0) {
                for (var j=0;j<g.stones.length;j++) {
                    capturedList.push({row:g.stones[j][0], col:g.stones[j][1], color:opp});
                    brd[g.stones[j][0]][g.stones[j][1]]=0;
                }
            }
        }
    }
    return capturedList;
}

// ==============================================================
// 绘制棋盘
// ==============================================================
function drawBoard() {
    calcDraw();
    var brd = (currentTab==='play') ? board : analyzeBoard;

    // 背景
    ctx.fillStyle = '#dcb35c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 线
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
    for (var i = 0; i < boardSize; i++) {
        var x = margin + i*cellSize, y = margin + i*cellSize;
        ctx.beginPath(); ctx.moveTo(x, margin); ctx.lineTo(x, margin+(boardSize-1)*cellSize); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(margin, y); ctx.lineTo(margin+(boardSize-1)*cellSize, y); ctx.stroke();
    }

    // 星位
    var sp = [];
    if (boardSize===19) sp=[[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
    else if (boardSize===13) sp=[[3,3],[3,9],[6,6],[9,3],[9,9]];
    else if (boardSize===9) sp=[[2,2],[2,6],[4,4],[6,2],[6,6]];
    ctx.fillStyle = '#333';
    for (var i=0;i<sp.length;i++) {
        ctx.beginPath(); ctx.arc(margin+sp[i][1]*cellSize, margin+sp[i][0]*cellSize, 3.5, 0, Math.PI*2); ctx.fill();
    }

    // 坐标
    ctx.fillStyle='#555'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
    for (var i=0;i<boardSize;i++) {
        ctx.fillText(COLS[i], margin+i*cellSize, margin-12);
        ctx.fillText(COLS[i], margin+i*cellSize, margin+(boardSize-1)*cellSize+20);
    }
    ctx.textAlign='right';
    for (var i=0;i<boardSize;i++) ctx.fillText(String(boardSize-i), margin-10, margin+i*cellSize+4);
    ctx.textAlign='left';
    for (var i=0;i<boardSize;i++) ctx.fillText(String(boardSize-i), margin+(boardSize-1)*cellSize+10, margin+i*cellSize+4);


// 棋子
for (var r=0;r<boardSize;r++) for (var c=0;c<boardSize;c++) if (brd[r]&&brd[r][c]!==0) drawStone(r,c,brd[r][c]);

    // 对弈: 最后一手标记
    if (currentTab==='play' && lastMove) {
        var lr=lastMove[0], lc=lastMove[1];
        var lx=margin+lc*cellSize, ly=margin+lr*cellSize;
        ctx.beginPath(); ctx.arc(lx, ly, cellSize*0.2, 0, Math.PI*2);
        ctx.strokeStyle = brd[lr][lc]===1 ? '#fff' : '#f00';
        ctx.lineWidth = 2; ctx.stroke();
    }

    // 分析: 落子手数标记（只显示到 analyzeMoveIndex）
    if (currentTab==='analyze' && analyzeMoveIndex>0) {
        for (var mi=0; mi<analyzeMoveIndex; mi++) {
            var mv = analyzeMoveHistory[mi];
            if (mv.pass) continue; // Pass 不绘制
            var mx = margin+mv.col*cellSize, my = margin+mv.row*cellSize;
            // 当前位置的最后一手加红圈
            if (mi === analyzeMoveIndex - 1) {
                ctx.beginPath(); ctx.arc(mx, my, cellSize*0.22, 0, Math.PI*2);
                ctx.strokeStyle = mv.color===1 ? '#fff' : '#f00';
                ctx.lineWidth = 2.5; ctx.stroke();
            }
            // 在棋子上显示手数编号（可通过开关控制）
            if (showMoveNumbers) {
                ctx.fillStyle = mv.color===1 ? '#fff' : '#000';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold '+Math.round(cellSize*0.32)+'px sans-serif';
                ctx.fillText(String(mi+1), mx, my);
            }
        }
        ctx.textBaseline = 'alphabetic';
    }

    // 分析: 复盘标注（疑问/失误/大失误/妙手的彩色小圆环，只在棋子仍在盘上时显示）
    if (currentTab==='analyze') {
        // 死活提示绘制：群体高亮 + 急救要点标记
        if (groupLifeResult && groupLifeResult.groupRC) {
            var ldCol = groupLifeResult.pending ? '#888' : (LD_COLOR[groupLifeResult.verdict]||'#888');
            for (var gi=0;gi<groupLifeResult.groupRC.length;gi++) {
                var grc = groupLifeResult.groupRC[gi];
                var gx = margin+grc[1]*cellSize, gy = margin+grc[0]*cellSize;
                ctx.beginPath(); ctx.arc(gx,gy,cellSize*0.62,0,Math.PI*2);
                ctx.strokeStyle = ldCol; ctx.lineWidth = Math.max(2,cellSize*0.12);
                if (groupLifeResult.pending) ctx.setLineDash([4,3]);
                ctx.stroke(); ctx.setLineDash([]);
            }
            if (!groupLifeResult.pending && groupLifeResult.vitalRC) {
                for (var vi=0;vi<groupLifeResult.vitalRC.length;vi++) {
                    var vrc = groupLifeResult.vitalRC[vi].rc || groupLifeResult.vitalRC[vi];
                    if (Array.isArray(vrc)) {
                        var vx = margin+vrc[1]*cellSize, vy = margin+vrc[0]*cellSize;
                        ctx.globalAlpha = 0.85;
                        ctx.beginPath(); ctx.arc(vx,vy,cellSize*0.42,0,Math.PI*2);
                        ctx.fillStyle = '#f8d76b'; ctx.fill();
                        ctx.globalAlpha = 1;
                        ctx.strokeStyle = '#3a2f00'; ctx.lineWidth = 1.5; ctx.stroke();
                    }
                }
            }
        }
    }

    // 对弈: 推荐走法 (红绿蓝)
    if (currentTab==='play' && playRecommendations.length>0) {
        for (var i=0;i<playRecommendations.length;i++) {
            var rec = playRecommendations[i];
            var pos = gtpToBoard(rec.move);
            if (!pos) continue;
            var rr=pos[0], cc=pos[1];
            var rx=margin+cc*cellSize, ry=margin+rr*cellSize;
            var rad=cellSize*0.55;

            ctx.beginPath(); ctx.arc(rx, ry, rad, 0, Math.PI*2);
            ctx.fillStyle = PLAY_REC_COLORS[i]; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
            ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();

            ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.font = 'bold '+Math.round(cellSize*0.36)+'px sans-serif';
            ctx.fillStyle='#000';
            ctx.fillText(rec.winrate+'%', rx, ry);
            ctx.textBaseline='alphabetic';
        }
    }

    // 分析: Top 5 推荐（悬停/固定 PV 推演时隐藏序号圈，由 PV 展开图取代）
    if (currentTab==='analyze' && analyzeResults.length>0 && hoveredPVIndex < 0 && pinnedPVIndex < 0) {
        for (var i=0;i<analyzeResults.length;i++) {
            var rec = analyzeResults[i];
            var pos = gtpToBoard(rec.move);
            if (!pos) continue;
            var rr=pos[0], cc=pos[1];
            var rx=margin+cc*cellSize, ry=margin+rr*cellSize;
            var rad=cellSize*0.58;

            ctx.beginPath(); ctx.arc(rx, ry, rad, 0, Math.PI*2);
            ctx.fillStyle = RANK_COLORS[i]; ctx.globalAlpha=0.9; ctx.fill(); ctx.globalAlpha=1;
            ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke();

            // 序号 — 黑色
            ctx.textAlign='center'; ctx.textBaseline='top';
            ctx.font = 'bold '+Math.round(cellSize*0.42)+'px sans-serif';
            ctx.fillStyle='#000';
            ctx.fillText(String(i+1), rx, ry-cellSize*0.30);
            // 胜率 — 黑色
            ctx.font = 'bold '+Math.round(cellSize*0.30)+'px sans-serif';
            ctx.fillStyle='#000';
            ctx.fillText(rec.winrate+'%', rx, ry+cellSize*0.08);
            ctx.textBaseline='alphabetic';
        }
    }
}

function drawStone(row, col, color) {
    var x=margin+col*cellSize, y=margin+row*cellSize, r=cellSize*0.45;
    ctx.beginPath(); ctx.arc(x+2,y+2,r,0,Math.PI*2); ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    if (color===1) {
        var g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
        g.addColorStop(0,'#555'); g.addColorStop(1,'#111'); ctx.fillStyle=g;
    } else {
        var g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);
        g.addColorStop(0,'#fff'); g.addColorStop(1,'#ccc'); ctx.fillStyle=g;
    }
    ctx.fill(); ctx.strokeStyle=color===1?'#000':'#999'; ctx.lineWidth=0.5; ctx.stroke();
}

canvas.addEventListener('click', function(e) {

    var pos = pixelToBoard(e.clientX-rect.left, e.clientY-rect.top);

        handleAnalyzeClick(row, col);
    }
});

// 固定展开变化图（由状态栏推荐条目点击触发）：固定 / 再点取消 / 点其他条目切换
function togglePinnedPV(row, col) {
    var idx = -1;
    for (var i=0;i<analyzeResults.length;i++) {
        var rp = gtpToBoard(analyzeResults[i].move);
        if (rp && rp[0]===row && rp[1]===col) { idx = i; break; }
    }
    if (idx < 0) return;
    // 点击当前已固定的项 → 取消；否则固定新项
    pinnedPVIndex = (pinnedPVIndex === idx) ? -1 : idx;
    hoveredPVIndex = -1;
    drawBoard();
    if (pinnedPVIndex >= 0) {
        var pv = analyzeResults[pinnedPVIndex].pv || [];
        if (pv.length === 0) {
            document.getElementById('analyze-status').innerHTML += '<br><span style="color:#e57373">⚠ 该候选点无后续变化数据</span>';
            return;
        }
        // 固定后立即绘制展开图（不等首次 mousemove）
        drawPVOverlay({pvMoves: pv, nextPlayer: analyzeNextColor});
        renderPvText(pinnedPVIndex);
    } else {
        renderAnalyzeStatusHtml();
    }
}

// 重新渲染推荐列表（取消固定时恢复）；条目可点击固定展开变化图
function renderAnalyzeStatusHtml() {
    var html = '<b>Top '+analyzeResults.length+' 推荐走法</b> (轮'+(analyzeNextColor==='B'?'黑':'白')+'走)<br>';
    for (var i=0;i<analyzeResults.length;i++) {
        var rec = analyzeResults[i];
        var sign = rec.scoreLead >= 0 ? '+' : '';
        var rp = gtpToBoard(rec.move);
        var open = (rp && rec.pv && rec.pv.length>0)
            ? '<span style="cursor:pointer" onclick="togglePinnedPV('+rp[0]+','+rp[1]+')">'
            : '<span>';
        html += open + '<span style="color:'+RANK_COLORS[i]+'">&#9679;</span> ' +
            '<b>'+(i+1)+'. '+rec.move+'</b>  胜率 '+rec.winrate+'%  ' +
            '领先 '+sign+rec.scoreLead+'目  ('+rec.visits+'次模拟)</span><br>';
    }
    html += '<br><span style="color:#f8d76b">➔ 点击棋盘任意空位即可试下落子（黑白交替），再点「AI 分析」查看新局面推荐；点击推荐条目可展开/收起变化图</span>';
    document.getElementById('analyze-status').innerHTML = html;
}

// 固定展开时的文字版变化序列
function renderPvText(idx) {
    var rec = analyzeResults[idx];
    var pv = rec.pv || [];
    var color = analyzeNextColor;
    var seq = [];
    for (var i=0;i<pv.length && i<PV_MAX_SHOW;i++) {
        seq.push((color==='B'?'黑':'白')+':'+pv[i]);
        color = (color==='B')?'W':'B';
    }
    var html = '<b>「'+rec.move+'」后续变化（前 '+seq.length+' 手，点击推荐条目收起）</b><br>' +
        '<span style="color:'+RANK_COLORS[idx]+'">&#9679;</span> '+seq.join(' → ') +
        (pv.length > PV_MAX_SHOW ? ' → …（共 '+pv.length+' 手）' : '');
    document.getElementById('analyze-status').innerHTML = html;
}

canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var pos = pixelToBoard(e.clientX-rect.left, e.clientY-rect.top);

    // 分析模式：检测是否悬停在推荐走法上，显示 PV 变化图（已固定展开时禁用悬停切换）
    if (currentTab==='analyze' && pinnedPVIndex >= 0) {
        // 已固定：重绘基础棋盘 + 固定的 PV 展开图，鼠标移动不切换
        drawBoard();
        drawPVOverlay({pvMoves: analyzeResults[pinnedPVIndex].pv || [], nextPlayer: analyzeNextColor});
        return;
    }
    if (currentTab==='analyze' && analyzeResults.length>0 && pos) {
        var foundIdx = -1;
        for (var i=0;i<analyzeResults.length;i++) {
            var rp = gtpToBoard(analyzeResults[i].move);
            if (rp && rp[0]===pos[0] && rp[1]===pos[1] && analyzeResults[i].pv && analyzeResults[i].pv.length>0) {
                foundIdx = i;
                break;
            }
        }
        if (foundIdx !== hoveredPVIndex) {
            hoveredPVIndex = foundIdx;
            drawBoard();
            if (hoveredPVIndex >= 0) {
                var pvData = {pvMoves: analyzeResults[hoveredPVIndex].pv, nextPlayer: document.getElementById('next-player').value};
                drawPVOverlay(pvData);
            }
        }
        // 如果悬停在推荐走法上，不显示落子预览
        if (hoveredPVIndex >= 0) return;
    } else if (hoveredPVIndex >= 0) {
        hoveredPVIndex = -1;
        drawBoard();
    } else {
        drawBoard();
    }

    if (!pos) return;
    var row=pos[0], col=pos[1];
    var x=margin+col*cellSize, y=margin+row*cellSize;

    if (currentTab==='play') {
        if (!gameActive||thinking) return;
        if (board[row][col]!==0) return;
        ctx.beginPath(); ctx.arc(x,y,cellSize*0.4,0,Math.PI*2);
        ctx.fillStyle = playerColor==='B' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)';
        ctx.fill();
    } else {
        if (isAnalyzing) return;
        // 落子模式：显示下一手颜色的半透明预览
        if (analyzeBoard[row]&&analyzeBoard[row][col]!==0) return;
        ctx.beginPath(); ctx.arc(x,y,cellSize*0.4,0,Math.PI*2);
        ctx.fillStyle = analyzeNextColor==='B' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)';
        ctx.fill();
    }
});

canvas.addEventListener('mouseleave', function() {
    if (hoveredPVIndex >= 0) {
        hoveredPVIndex = -1;
        drawBoard();
    }
});

// PV 变化图绘制
function drawPVOverlay(pvData) {
    var pvMoves = pvData.pvMoves;
    var currentColor = pvData.nextPlayer; // 第一手是 nextPlayer 的颜色
    for (var i=0; i<pvMoves.length && i<PV_MAX_SHOW; i++) {
        var pos = gtpToBoard(pvMoves[i]);
        if (!pos) continue; // pass 等跳过
        var pr=pos[0], pc=pos[1];
        var px=margin+pc*cellSize, py=margin+pr*cellSize;
        var stoneColor = (currentColor==='B') ? 1 : 2;

        // 半透明棋子
        ctx.globalAlpha = 0.55;
        var rad = cellSize*0.42;
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI*2);
        if (stoneColor===1) {
            ctx.fillStyle = '#222';
        } else {
            ctx.fillStyle = '#eee';
        }
        ctx.fill();
        ctx.strokeStyle = stoneColor===1 ? '#000' : '#999';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // 手数编号
        ctx.fillStyle = stoneColor===1 ? '#fff' : '#000';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold '+Math.round(cellSize*0.36)+'px sans-serif';
        ctx.fillText(String(i+1), px, py);

        // 交替颜色
        currentColor = (currentColor==='B') ? 'W' : 'B';
    }
    ctx.textBaseline = 'alphabetic';
}

// ==============================================================
// 对弈逻辑
// ==============================================================
function initPlayBoard() {
    board = [];
    for (var r=0;r<boardSize;r++) { board[r]=[]; for(var c=0;c<boardSize;c++) board[r][c]=0; }
    moveHistory=[]; lastMove=null;
}

function handlePlayClick(row, col) {
    if (!gameActive||thinking) return;
    if (board[row][col]!==0) return;
    playRecommendations = []; // 落子时清除推荐
    var move = boardToGTP(row, col);
    var cn = playerColor==='B' ? 1 : 2;
    board[row][col] = cn;
    removeCaptures(row, col, cn, board);
    lastMove = [row, col];
    moveHistory.push(playerColor+': '+move);
    drawBoard(); updateHistory();

    document.getElementById('status').innerHTML = '<span class="thinking">AI 思考中...</span>';
    thinking = true;

    fetch('/api/play', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({color:playerColor, move:move})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status==='ok' && data.ai_move) {
            var m = data.ai_move;
            if (m.toLowerCase()==='pass') {
                moveHistory.push(aiColor+': Pass');
                document.getElementById('status').innerHTML = 'AI 选择 Pass';
            } else if (m.toLowerCase()==='resign') {
                moveHistory.push(aiColor+': Resign');
                document.getElementById('status').innerHTML = 'AI 认输了! 恭喜你获胜!';
                gameActive = false;
            } else {
                var ap = gtpToBoard(m);
                if (ap) {
                    var acn = aiColor==='B'?1:2;
                    board[ap[0]][ap[1]] = acn;
                    removeCaptures(ap[0], ap[1], acn, board);
                    lastMove = ap;
                    moveHistory.push(aiColor+': '+m);
                    document.getElementById('status').innerHTML = 'AI 落子: '+m;
                }
            }
            drawBoard(); updateHistory();
            // AI落子后获取推荐
            if (gameActive) fetchPlayRecommendations();
        } else {
            document.getElementById('status').innerHTML = '错误: '+(data.message||'未知');
        }
        thinking = false;
    }).catch(function(err){
        document.getElementById('status').innerHTML = '通信错误: '+err.message;
        thinking = false;
    });
}

function newGame() {
    boardSize = parseInt(document.getElementById('board-size').value);
    playerColor = document.getElementById('player-color').value;
    aiColor = playerColor==='B'?'W':'B';
    initPlayBoard();
    // 同步初始化分析棋盘
    analyzeBoard=[]; analyzeBaseBoard=[];
    for(var r=0;r<boardSize;r++){analyzeBoard[r]=[];analyzeBaseBoard[r]=[];for(var c=0;c<boardSize;c++){analyzeBoard[r][c]=0;analyzeBaseBoard[r][c]=0;}}
    analyzeMoveHistory=[]; analyzeMoveIndex=0; updateMoveIndexDisplay();
    drawBoard();

    var maxVisits = parseInt(document.getElementById('ai-strength').value);
    fetch('/api/new_game', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({board_size:boardSize, komi:6.5, max_visits:maxVisits})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status==='ok') {
            gameActive = true;
            document.getElementById('status').innerHTML = '对局开始! 请落子';
            document.getElementById('move-history').innerHTML = '';
            if (playerColor==='W') {
                document.getElementById('status').innerHTML = '<span class="thinking">AI 先手思考中...</span>';
                thinking = true;
                fetch('/api/ai_move', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({color:'B'})
                }).then(function(r){return r.json();}).then(function(d){
                    if (d.status==='ok' && d.ai_move) {
                        var ap = gtpToBoard(d.ai_move);
                        if (ap) { board[ap[0]][ap[1]]=1; lastMove=ap; moveHistory.push('B: '+d.ai_move); drawBoard(); updateHistory(); }
                        document.getElementById('status').innerHTML = 'AI 落子: '+d.ai_move+'，轮到你了';
                        fetchPlayRecommendations();
                    }
                    thinking = false;
                });
            }
        }
    }).catch(function(err){
        document.getElementById('status').innerHTML = '启动失败: '+err.message;
    });
}

function undoMove() {
    if (!gameActive||thinking||moveHistory.length<2) return;
    // keep = 保留的着法数：后端截断自己的历史后从空盘重放，与前端各自弹栈保持一致
    fetch('/api/undo', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({keep: moveHistory.length - 2})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status==='ok') {
            var saved = moveHistory.slice(0,-2);
            initPlayBoard();
            moveHistory = saved;
            for (var i=0;i<saved.length;i++) {
                var parts = saved[i].split(': ');
                var p = gtpToBoard(parts[1]);
                if (p) { var cn=parts[0]==='B'?1:2; board[p[0]][p[1]]=cn; removeCaptures(p[0],p[1],cn,board); lastMove=p; }
            }
            drawBoard(); updateHistory();
            document.getElementById('status').innerHTML = '已悔棋，轮到你落子';
        }
    });
}

function passMove() {
    if (!gameActive||thinking) return;
    document.getElementById('status').innerHTML = '<span class="thinking">AI 思考中...</span>';
    thinking = true;
    fetch('/api/pass', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({color:playerColor})
    }).then(function(r){return r.json();}).then(function(data){
        moveHistory.push(playerColor+': Pass');
        if (data.ai_move) {
            if (data.ai_move.toLowerCase()==='pass') {
                moveHistory.push(aiColor+': Pass');
                document.getElementById('status').innerHTML = '双方都 Pass，对局结束!';
                gameActive = false;
            } else {
                var ap = gtpToBoard(data.ai_move);
                if (ap) {
                    var acn=aiColor==='B'?1:2;
                    board[ap[0]][ap[1]]=acn; removeCaptures(ap[0],ap[1],acn,board);
                    lastMove=ap; moveHistory.push(aiColor+': '+data.ai_move);
                }
                document.getElementById('status').innerHTML = 'AI 落子: '+data.ai_move;
                drawBoard();
            }
            updateHistory();
        }
        thinking = false;
    });
}

function resignGame() {
    if (!gameActive) return;
    gameActive = false;
    document.getElementById('status').innerHTML = '你认输了。AI 获胜。';
}

function updateHistory() {
    var el = document.getElementById('move-history');
    var html = '';
    for (var i=0;i<moveHistory.length;i++) html += '<div>'+(i+1)+'. '+moveHistory[i]+'</div>';
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
    autoSaveGame();
}

// ==============================================================
// 对局保存与载入（localStorage）
// ==============================================================
var SAVE_KEY = 'goai_saved_games';
var SAVE_MAX = 50;

function getSavedGames() {
    try {
        var raw = localStorage.getItem(SAVE_KEY);
        var list = raw ? JSON.parse(raw) : [];
        return (Array.isArray(list)) ? list : [];
    } catch (e) { return []; }
}

function putSavedGames(list) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(list)); return true; }
    catch (e) { return false; }
}

// 构造当前对局的存档记录（不写入）
function buildGameRecord(autosave) {
    return {
        id: 'g' + Date.now() + Math.floor(Math.random()*1000),
        ts: Date.now(),
        autosave: !!autosave,
        name: null, // 保存时生成
        board_size: boardSize,
        komi: 6.5,
        player_color: playerColor,
        ai_strength: document.getElementById('ai-strength') ? parseInt(document.getElementById('ai-strength').value) : 1600,
        moves: moveHistory.slice()
    };
}

// 每手棋后自动保存（单一 autosave 槽，刷新页面可恢复）
function autoSaveGame() {
    if (!gameActive || moveHistory.length === 0) return;
    var rec = buildGameRecord(true);
    rec.name = '⏺ 当前对局（自动保存）';
    var list = getSavedGames();
    list = list.filter(function(r){ return !r.autosave; });
    list.unshift(rec);
    putSavedGames(list);
}

function saveCurrentGame() {
    if (moveHistory.length === 0) {
        alert('还没有落子，无需保存');
        return;
    }
    var rec = buildGameRecord(false);
    var d = new Date();
    var ts = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    rec.name = ts+' '+boardSize+'路 '+(playerColor==='B'?'执黑':'执白')+' '+moveHistory.length+'手';
    var list = getSavedGames();
    var manual = list.filter(function(r){ return !r.autosave; });
    var autos = list.filter(function(r){ return r.autosave; });
    manual.unshift(rec);
    if (manual.length > SAVE_MAX) manual = manual.slice(0, SAVE_MAX);
    var ok = putSavedGames(manual.concat(autos));
    if (ok) {
        document.getElementById('status').innerHTML = '已保存对局「'+rec.name+'」，可在「历史对局」中载入';
    } else {
        document.getElementById('status').innerHTML = '保存失败（浏览器存储不可用）';
    }
}

    renderGameList();
    document.getElementById('games-modal').classList.add('open');
}
function closeGamesModal() {
    document.getElementById('games-modal').classList.remove('open');
}

function renderGameList() {
    var el = document.getElementById('game-list');
    var list = getSavedGames();
    if (list.length === 0) {
        el.innerHTML = '<div style="color:#666;text-align:center;padding:30px;">暂无保存的对局<br>对弈中点击「保存对局」或落子后自动保存</div>';
        return;
    }
    var html = '';
    for (var i=0;i<list.length;i++) {
        var r = list[i];
        var d = new Date(r.ts);
        var time = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
        var meta = r.board_size+'路 · '+(r.player_color==='B'?'执黑':'执白')+' · '+r.moves.length+'手 · '+time;
        html += '<div class="game-item">'+
            '<div class="gi-info"><div class="gi-name">'+(r.name||'未命名对局')+'</div><div class="gi-meta">'+meta+'</div></div>'+
            '<div class="gi-actions">'+
            '<button class="mini-btn load" onclick="loadSavedGame(\''+r.id+'\')">载入</button>'+
            '<button class="mini-btn del" onclick="deleteSavedGame(\''+r.id+'\')">删除</button>'+
            '</div></div>';
    }
    el.innerHTML = html;
}

function deleteSavedGame(id) {
    var list = getSavedGames();
    var target = null;
    for (var i=0;i<list.length;i++) if (list[i].id===id) { target = list[i]; break; }
    if (!target) return;
    // autosave 槽正在被当前对局使用，删除时同步结束对局
    if (target.autosave && gameActive && target.moves.length>0 && target.moves.length===moveHistory.length
        && target.player_color===playerColor && target.board_size===boardSize) {
        if (!confirm('这是当前对局的自动保存，删除将无法恢复，确定？')) return;
        gameActive = false;
        document.getElementById('status').innerHTML = '当前对局已结束（自动保存被删除）';
    }
    list = list.filter(function(r){ return r.id !== id; });
    putSavedGames(list);
    renderGameList();
}

// 把 "B: D4" 字符串历史转为 [["B","D4"],...] 供后端重放
function historyToMoveList(hist) {
    var out = [];
    for (var i=0;i<hist.length;i++) {
        var parts = hist[i].split(': ');
        if (parts.length !== 2) continue;
        var m = parts[1];
        if (m.toLowerCase()==='pass') { out.push([parts[0], 'pass']); continue; }
        if (m.toLowerCase()==='resign') continue; // 终局标记不重放
        out.push([parts[0], m]);
    }
    return out;
}

function loadSavedGame(id) {
    if (thinking) { alert('AI 思考中，请稍候'); return; }
    var rec = null;
    var list = getSavedGames();
    for (var i=0;i<list.length;i++) if (list[i].id===id) { rec = list[i]; break; }
    if (!rec) { renderGameList(); return; }

    // 同步 UI 设置
    document.getElementById('board-size').value = String(rec.board_size);
    document.getElementById('player-color').value = rec.player_color;
    if (rec.ai_strength) document.getElementById('ai-strength').value = String(rec.ai_strength);
    boardSize = rec.board_size;
    playerColor = rec.player_color;
    aiColor = playerColor==='B' ? 'W' : 'B';

    document.getElementById('status').innerHTML = '<span class="thinking">正在载入对局...</span>';
    var moveList = historyToMoveList(rec.moves);

    fetch('/api/load_game', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({board_size:rec.board_size, komi:rec.komi||6.5, max_visits:rec.ai_strength||1600, moves:moveList})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status !== 'ok') {
            document.getElementById('status').innerHTML = '载入失败: '+(data.message||'未知错误');
            return;
        }
        applyLoadedGame(rec);
        closeGamesModal();
    }).catch(function(err){
        document.getElementById('status').innerHTML = '载入请求失败: '+err.message;
    });
}

function applyLoadedGame(rec) {
    // 前端重建棋盘与历史
    initPlayBoard();
    var saved = rec.moves.slice();
    for (var i=0;i<saved.length;i++) {
        var parts = saved[i].split(': ');
        if (parts.length !== 2) continue;
        var m = parts[1];
        if (m.toLowerCase()==='resign') { moveHistory.push(saved[i]); continue; }
        if (m.toLowerCase()!=='pass') {
            var p = gtpToBoard(m);
            if (p) { var cn = parts[0]==='B'?1:2; board[p[0]][p[1]]=cn; removeCaptures(p[0],p[1],cn,board); lastMove=p; }
        }
        moveHistory.push(saved[i]);
    }
    // 含 Resign 的存档：对局已结束，不再激活
    var endedWithResign = moveHistory.length>0 && /: Resign$/i.test(moveHistory[moveHistory.length-1]);
    gameActive = !endedWithResign;
    drawBoard();

    // 同步分析模式棋盘：完整历史（含提子重放）可供复盘
    analyzeBoard = [];
    analyzeBaseBoard = [];
    for (var r=0;r<boardSize;r++){analyzeBoard[r]=[];analyzeBaseBoard[r]=[];for(var c=0;c<boardSize;c++){analyzeBoard[r][c]=0;analyzeBaseBoard[r][c]=0;}}
    analyzeMoveHistory = [];
    for (var j=0;j<moveHistory.length;j++) {
        var pr = moveHistory[j].split(': ');
        if (pr.length!==2 || pr[1].toLowerCase()==='pass' || pr[1].toLowerCase()==='resign') continue;
        var rc = gtpToBoard(pr[1]);
        if (!rc) continue;
        var acn2 = pr[0]==='B' ? 1 : 2;
        analyzeBoard[rc[0]][rc[1]] = acn2;
        var cap = removeCaptures(rc[0], rc[1], acn2, analyzeBoard);
        analyzeMoveHistory.push({row:rc[0], col:rc[1], color:acn2, captured:cap});
    }
    analyzeMoveIndex = 0;
    updateMoveIndexDisplay();

    // 判断轮到谁
    var lastColor = null;
    for (var k=moveHistory.length-1;k>=0;k--) {
        var pp = moveHistory[k].split(': ');
        if (pp.length===2) { lastColor = pp[0]; break; }
    }
    var nextColor = lastColor ? (lastColor==='B'?'W':'B') : 'B';

    if (!gameActive) {
        document.getElementById('status').innerHTML = '已载入「'+(rec.name||'对局')+'」'+moveHistory.length+'手，该对局已结束（Resign），仅供复盘';
    } else if (nextColor === playerColor) {
        document.getElementById('status').innerHTML = '已载入「'+(rec.name||'对局')+'」'+moveHistory.length+'手，轮到你落子';
    } else {
        document.getElementById('status').innerHTML = '<span class="thinking">已载入对局，AI 思考中...</span>';
        thinking = true;
        fetch('/api/ai_move', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({color:aiColor})
        }).then(function(r){return r.json();}).then(function(d){
            if (d.status==='ok' && d.ai_move) {
                var ap = gtpToBoard(d.ai_move);
                if (ap) { var acn=aiColor==='B'?1:2; board[ap[0]][ap[1]]=acn; removeCaptures(ap[0],ap[1],acn,board); lastMove=ap; moveHistory.push(aiColor+': '+d.ai_move); drawBoard(); updateHistory(); }
                document.getElementById('status').innerHTML = '已载入对局，AI 落子: '+d.ai_move+'，轮到你';
            }
            thinking = false;
        }).catch(function(){ thinking = false; });
    }
    updateHistory();
}

// ==============================================================
// 导出 SGF 棋谱
// ==============================================================
function exportSGF() {
    if (moveHistory.length === 0) {
        alert('还没有棋谱可以导出');
        return;
    }
    // SGF 坐标：a-s 代表 1-19 列/行，从左上角开始
    function toSGFCoord(gtp) {
        if (!gtp || gtp.toLowerCase()==='pass') return '';
        var c = COLS.indexOf(gtp[0].toUpperCase());
        var r = boardSize - parseInt(gtp.slice(1));
        if (c < 0 || r < 0) return '';
        return String.fromCharCode(97+c) + String.fromCharCode(97+r);
    }
    var sgf = '(;GM[1]FF[4]CA[UTF-8]SZ['+boardSize+']KM[6.5]\n';
    sgf += 'PB['+(playerColor==='B'?'Player':'KataGo')+']\n';
    sgf += 'PW['+(playerColor==='W'?'Player':'KataGo')+']\n';
    sgf += 'DT['+new Date().toISOString().slice(0,10)+']\n';
    sgf += 'AP[GoAI-Local]\n';
    for (var i=0; i<moveHistory.length; i++) {
        var parts = moveHistory[i].split(': ');
        var color = parts[0];
        var move = parts[1];
        var coord = toSGFCoord(move);
        sgf += ';' + color + '[' + coord + ']';
        if ((i+1)%10===0) sgf += '\n';
    }
    sgf += ')';

    var blob = new Blob([sgf], {type:'application/x-go-sgf'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'game_'+new Date().toISOString().slice(0,10)+'.sgf';
    a.click();
    URL.revokeObjectURL(url);
}

// 对弈模式: 推荐走法 & 提示
// ==============================================================
function requestHint() {
    if (!gameActive || thinking) return;
    document.getElementById('status').innerHTML = '<span class="thinking">AI 分析中...</span>';
    fetchPlayRecommendations();
}

function fetchPlayRecommendations() {
    var stones = [];
    for (var r=0;r<boardSize;r++) for(var c=0;c<boardSize;c++) {
        if (board[r]&&board[r][c]!==0) {
            stones.push({color: board[r][c]===1?'B':'W', pos: COLS[c]+String(boardSize-r)});
        }
    }
    if (stones.length===0) return;

    // 从 moveHistory 构造 move_history 序列（按实际下棋顺序）
    var moveHistoryList = [];
    for (var i=0; i<moveHistory.length; i++) {
        var parts = moveHistory[i].split(': ');
        var color = parts[0];
        var move = parts[1];
        if (move && move.toLowerCase() !== 'pass' && move.toLowerCase() !== 'resign') {
            moveHistoryList.push([color, move]);
        } else if (move && move.toLowerCase() === 'pass') {
            moveHistoryList.push([color, 'pass']);
        }
    }

    fetch('/api/analyze', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({stones:stones, next_player:playerColor, board_size:boardSize, komi:6.5, max_visits:800, move_history:moveHistoryList})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status==='ok' && data.recommendations) {
            playRecommendations = data.recommendations.slice(0, 3);
            drawBoard();
            // 形势判断（基于最佳走法的胜率和目差）
            var best = data.recommendations[0];
            var winColor = playerColor==='B' ? '黑' : '白';
            var sign = best.scoreLead >= 0 ? '+' : '';
            var evalHtml = '<span style="color:#7ecfff;">形势: ' + winColor + '胜率 ' + best.winrate + '%  ' + sign + best.scoreLead + '目</span>';
            // 推荐走法
            var hint = '推荐: ';
            for (var i=0;i<playRecommendations.length;i++) {
                var rec = playRecommendations[i];
                hint += '<span style="color:'+PLAY_REC_COLORS[i]+'">●</span> '+rec.move+' ('+rec.winrate+'%)  ';
            }
            var statusEl = document.getElementById('status');
            statusEl.innerHTML += '<br>' + evalHtml + '<br>' + hint;
        }
    }).catch(function(err){ /* 静默失败 */ });
}

function importSgfText(sgfText, filename) {
    fetch('/api/import_sgf', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sgf: sgfText})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status !== 'ok') {
            document.getElementById('analyze-status').innerHTML = '导入失败: '+(data.message||'未知错误');
            return;
        }
        applyImportedSgf(data, filename);
    }).catch(function(err){
        document.getElementById('analyze-status').innerHTML = '导入请求失败: '+err.message;
    });
}

function applyImportedSgf(data, filename) {
    // 切换棋盘大小并初始化分析棋盘
    boardSize = data.board_size;
    initAnalyzeBoardData();
    analyzeKomi = (typeof data.komi === 'number') ? data.komi : 6.5;
    // 摆子 AB/AW → 基础棋盘 + 当前棋盘（摆子必须先就位，后续着法的提子才能正确计算）
    var setup = data.setup_stones || [];
    for (var i=0;i<setup.length;i++) {
        var p = gtpToBoard(setup[i][1]);
        if (p) {
            analyzeBaseBoard[p[0]][p[1]] = (setup[i][0]==='B') ? 1 : 2;
            analyzeBoard[p[0]][p[1]] = (setup[i][0]==='B') ? 1 : 2;
        }
    }
    // 主线着法 → 历史记录（含提子模拟）
    var moves = data.moves || [];
    var passCount = 0;
    for (var j=0;j<moves.length;j++) {
        var color = moves[j][0];
        var cn = color==='B' ? 1 : 2;
        var mv = {color: cn, pass: false};
        if (moves[j][1] === 'pass') {
            mv.pass = true;
            passCount++;
        } else {
            var rc = gtpToBoard(moves[j][1]);
            if (!rc) continue;
            analyzeBoard[rc[0]][rc[1]] = cn;
            mv.row = rc[0]; mv.col = rc[1];
            mv.captured = removeCaptures(rc[0], rc[1], cn, analyzeBoard);
        }
        analyzeMoveHistory.push(mv);
    }
    analyzeMoveIndex = analyzeMoveHistory.length;
    rebuildAnalyzeBoard();
    // 下一手颜色
    if (analyzeMoveHistory.length > 0) {
        var lastColor = analyzeMoveHistory[analyzeMoveHistory.length-1].color;
        analyzeNextColor = (lastColor === 1) ? 'W' : 'B';
    } else {
        inferNextPlayer();
    }
    document.getElementById('next-player').value = analyzeNextColor;
    updateMoveIndexDisplay();
    updateStoneCount();
    updatePlayModeIndicator();
    drawBoard();

    // 状态信息
    var meta = data.meta || {};
    var html = '<b>已导入'+(filename?('「'+filename+'」'):'')+'</b><br>';
    if (meta.PB || meta.PW) html += (meta.PB||'黑')+' (黑) vs '+(meta.PW||'白')+' (白)<br>';
    html += data.board_size+'路棋盘, 贴目 '+data.komi+', 共 '+data.move_count+' 手';
    if (setup.length>0) html += ', 摆子 '+setup.length+' 枚';
    if (passCount>0) html += '（含 '+passCount+' 手 Pass）';
    if (meta.RE) html += '<br>结果: '+meta.RE;
    if (meta.DT) html += '&nbsp;日期: '+meta.DT;
    if (meta.EV) html += '<br>赛事: '+meta.EV;
    html += '<br><span style="color:#f8d76b">⬅ ➡ 浏览每一手，点击「AI 分析」查看任意局面的推荐</span>';
    document.getElementById('analyze-status').innerHTML = html;
}

var groupLifeOn = false;
var groupLifeResult = null;  // {group:[r,c]数组, verdict, liberties, ...}
var LD_TXT = {alive:'✔ 安然无恙（活棋）', critical:'⚠ 生死攸关（未活净）', dead:'✘ 大势已去（死棋）'};
var LD_COLOR = {alive:'#4a9d6a', critical:'#c9a227', dead:'#d94a4a'};

function toggleGroupLife() {
    groupLifeOn = !groupLifeOn;
    var btn = document.getElementById('btn-grouplife');
    if (groupLifeOn) {
        btn.textContent = '❤️‍🩹 死活中…点击棋子查询';
        btn.style.background = '#d9772a';
        btn.style.color = '#fff';
        document.getElementById('analyze-status').innerHTML = '<span style="color:#d9772a;">死活提示已开启：点击棋盘上任意棋子，AI 会判断该棋块（连同连通的己方棋子）是活是死、有几口气，并给出急救要点（不会落子）</span>';
    } else {
        btn.textContent = '❤️‍🩹 死活提示';
        btn.style.background = '';
        btn.style.color = '';
        groupLifeResult = null;
        drawBoard();
        document.getElementById('analyze-status').innerHTML = '死活提示已关闭';
    }
}

function groupLifeClick(row, col) {
    if (thinking) return;
    // 只允许点在棋子上
    if (!analyzeBoard[row] || analyzeBoard[row][col]===0) {
        document.getElementById('analyze-status').innerHTML = '<span style="color:#e57373;">请点击棋盘上的一颗棋子（死活提示针对棋块）</span>';
        return;
    }
    var gtp = COLS[col]+String(boardSize-row);
    var color = analyzeNextColor;
    var snap = buildAnalyzeSnapshot();
    groupLifeResult = {pending:true, group:[[row,col]]};
    drawBoard();
    var tok = analyzeStatusBegin();
    analyzeStatusSet(tok, '<span class="thinking">正在评估 '+gtp+' 所在棋块的死活...</span>');
    fetch('/api/group_life', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({stones:snap.stones, setup_stones:snap.setup_stones, next_player:color, target:gtp, move_history:snap.move_history, board_size:boardSize, komi:analyzeKomi, max_visits:400})
    }).then(function(r){return r.json();}).then(function(data){
        if (tok !== analyzeStatusCurrent()) return; // 过期响应：忽略，不碰棋盘与状态栏
        if (data.status !== 'ok') {
            groupLifeResult = null;
            drawBoard();
            analyzeStatusSet(tok, '死活评估失败: '+(data.message||'未知错误'));
            return;
        }
        // GTP 坐标转回棋盘行列
        var grp = [];
        for (var i=0;i<data.group.length;i++) {
            var rc = gtpToBoard(data.group[i]);
            if (rc) grp.push(rc);
        }
        data.groupRC = grp;
        var vpts = [];
        for (var j=0;j<(data.vital_points||[]).length;j++) {
            var vrc = gtpToBoard(data.vital_points[j].move);
            if (vrc) { data.vital_points[j].rc = vrc; vpts.push(data.vital_points[j]); }
        }
        data.vitalRC = vpts;
        groupLifeResult = data;
        drawBoard();
        var colorName = data.color==='B'?'黑':'白';
        var libWarn = data.liberties<=1 ? ' <span style="color:#d94a4a;font-weight:bold;">（仅剩 '+data.liberties+' 口气，随时会被提！）</span>' : '，'+data.liberties+' 口气';
        var html = '<span style="color:'+LD_COLOR[data.verdict]+';font-weight:bold;">'+LD_TXT[data.verdict]+'</span> '+colorName+'棋块（'+data.group_size+' 子'+libWarn+'，存活度 '+Math.round(data.survival*100)+'%）';
        if (vpts.length>0) {
            html += '<br>急救要点：';
            for (var k=0;k<vpts.length;k++) {
                html += ' <b style="color:#f8d76b;">'+vpts[k].move+'</b>'+(vpts[k].pv&&vpts[k].pv.length>0?'（'+vpts[k].pv.slice(0,3).join(' → ')+'…）':'');
            }
        } else if (data.recommended) {
            html += '<br>急救要点：暂无近距离要点，引擎全局推荐 '+data.recommended;
        }
        if (data.verdict==='dead') html += '<br><span style="color:#888;font-size:0.92em;">提示：死棋可考虑脱先弃子，或全局推荐 '+data.recommended+'</span>';
        else if (data.verdict==='critical') html += '<br><span style="color:#888;font-size:0.92em;">提示：先手补活/加护要点已用黄色标出</span>';
        analyzeStatusSet(tok, html);
    }).catch(function(err){
        if (tok !== analyzeStatusCurrent()) return;
        groupLifeResult = null;
        drawBoard();
        analyzeStatusSet(tok, '死活评估请求失败: '+err.message);
    });
}

function explainPosition() {

    var snap = buildAnalyzeSnapshot();

    fetch('/api/explain', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({stones:snap.stones, setup_stones:snap.setup_stones, next_player:analyzeNextColor, move_history:snap.move_history, board_size:boardSize, komi:analyzeKomi, max_visits:400})
    }).then(function(r){return r.json();}).then(function(data){

        if (data.status !== 'ok') {
            analyzeStatusSet(tok, '讲解生成失败: '+(data.message||'未知错误'));
            return;
        }
        var modeTag = data.mode==='llm' ? '<span style="color:#8a5cf5;">[LLM 大模型讲解]</span>' : '<span style="color:#4a9d6a;">[AI 智能讲解]</span>';
        var html = modeTag + '<br><br>' + data.explanation.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
        html += '<br><br><span style="color:#888;font-size:0.9em;">首推 '+data.best_move+'（胜率 '+data.winrate+'%，目差 '+data.score_lead+'），耗时 '+data.elapsed+' 秒</span>';
        document.getElementById('explain-body').innerHTML = html;

var wrPoints = null;      // [{turn,winrate,scoreLead},...]
var wrGeom = null;       // 绘图几何信息（用于点击/悬停定位）

function showWinrateChart() {
    // 需要：基础棋盘无摆子 + 有着法历史（分析整局用 moves 路径）
    var baseHasStones = false;
    for (var br=0;br<boardSize;br++) for (var bc=0;bc<boardSize;bc++) { if (analyzeBaseBoard[br][bc]!==0) { baseHasStones=true; } }
    if (baseHasStones) {
        document.getElementById('analyze-status').innerHTML = '胜率曲线需要完整下棋顺序（当前棋盘含无顺序摆子，如截图识别），请先导入棋谱或从对局载入';
        return;
    }
    if (analyzeMoveHistory.length < 2) {
        document.getElementById('analyze-status').innerHTML = '至少需要 2 手棋才能绘制胜率曲线';
        return;
    }
    // 构造 move_history（当前历史全部，不限浏览位置：曲线是整局的）
    var mh = [];
    for (var i=0;i<analyzeMoveHistory.length;i++) {
        var mv = analyzeMoveHistory[i];
        var cl = mv.color===1?'B':'W';
        if (mv.pass) mh.push([cl,'pass']);
        else mh.push([cl, COLS[mv.col]+String(boardSize-mv.row)]);
    }
    // 长对局自动降 visits 平衡耗时：>60 手用 60 visits，>120 手用 40 visits（每手约 0.8-1.5s）
    var vis = 100;
    if (mh.length > 120) vis = 40; else if (mh.length > 60) vis = 60;
    var tok = analyzeStatusBegin();
    analyzeStatusSet(tok, '<span class="thinking">正在整局分析（'+mh.length+' 手，约需 '+Math.round(mh.length*1.5)+' 秒）...</span>');
    document.getElementById('btn-analyze').disabled = true;
    var wrBtn = document.getElementById('btn-winrate');
    if (wrBtn) wrBtn.disabled = true;
    fetch('/api/analyze_game', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({move_history:mh, board_size:boardSize, komi:analyzeKomi, max_visits:vis})
    }).then(function(r){return r.json();}).then(function(data){
        document.getElementById('btn-analyze').disabled = false;
        if (wrBtn) wrBtn.disabled = false;
        if (tok !== analyzeStatusCurrent()) return; // 过期响应：忽略
        if (data.status !== 'ok') {
            analyzeStatusSet(tok, '整局分析失败: '+(data.message||'未知错误'));
            return;
        }
        wrPoints = data.points;
        analyzeStatusSet(tok, '整局分析完成（'+data.turn_count+' 手，耗时 '+data.elapsed+' 秒），胜率曲线已打开');
        document.getElementById('wr-summary').innerHTML = '黑方初始胜率 '+(wrPoints[0]?wrPoints[0].winrate:'—')+'%，终局 '+(wrPoints[wrPoints.length-1]?wrPoints[wrPoints.length-1].winrate:'—')+'% · 黑棋视角 · 中国规则';
        drawWinrateChart();
        document.getElementById('winrate-modal').classList.add('open');
    }).catch(function(err){
        document.getElementById('btn-analyze').disabled = false;
        if (wrBtn) wrBtn.disabled = false;
        if (tok !== analyzeStatusCurrent()) return;
        analyzeStatusSet(tok, '整局分析请求失败: '+err.message);
    });
}

function drawWinrateChart() {
    if (!wrPoints) return;
    var cv = document.getElementById('winrate-canvas');
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    var padL = 44, padR = 14, padT = 14, padB = 30;
    var pw = W-padL-padR, ph = H-padT-padB;
    var n = wrPoints.length;
    var maxTurn = wrPoints[n-1].turn;
    var showScore = document.getElementById('wr-show-score').checked;
    // 目差轴范围
    var sMin = 0, sMax = 0;
    if (showScore) {
        for (var i=0;i<n;i++) { if (wrPoints[i].scoreLead<sMin) sMin=wrPoints[i].scoreLead; if (wrPoints[i].scoreLead>sMax) sMax=wrPoints[i].scoreLead; }
        sMax = Math.max(sMax, 5); sMin = Math.min(sMin, -5);
    }
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#0d1326'; ctx.fillRect(0,0,W,H);
    var xOf = function(turn) { return padL + (turn-1)/(maxTurn-1||1)*pw; };
    var yOf = function(wr) { return padT + (1-wr/100)*ph; };
    var yOfS = function(s) { return padT + (1-(s-sMin)/(sMax-sMin))*ph; };

    // 网格与刻度（胜率 0/25/50/75/100）
    ctx.strokeStyle = '#1e2a4a'; ctx.lineWidth = 1;
    ctx.fillStyle = '#667'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
    [0,25,50,75,100].forEach(function(w) {
        var y = yOf(w);
        ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
        ctx.fillText(w+'%', padL-6, y+3);
    });
    // 50% 参考线加亮
    ctx.strokeStyle = '#3a4a7a';
    ctx.beginPath(); ctx.moveTo(padL,yOf(50)); ctx.lineTo(W-padR,yOf(50)); ctx.stroke();

    // x 轴刻度（手数，最多 10 个）
    ctx.textAlign = 'center';
    var step = Math.max(1, Math.ceil(maxTurn/10));
    for (var t=1;t<=maxTurn;t+=step) { ctx.fillText(t, xOf(t), H-8); }

    // 目差曲线（可选）
    if (showScore) {
        ctx.strokeStyle = '#d9a04a'; ctx.lineWidth = 1.5; ctx.beginPath();
        for (var j=0;j<n;j++) {
            var x = xOf(wrPoints[j].turn), y = yOfS(wrPoints[j].scoreLead);
            if (j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.stroke();
        // 0 目线
        ctx.strokeStyle = 'rgba(217,160,74,0.25)';
        ctx.beginPath(); ctx.moveTo(padL,yOfS(0)); ctx.lineTo(W-padR,yOfS(0)); ctx.stroke();
    }

    // 胜率主曲线
    ctx.strokeStyle = '#4a9d6a'; ctx.lineWidth = 2; ctx.beginPath();
    for (var k=0;k<n;k++) {
        var xx = xOf(wrPoints[k].turn), yy = yOf(wrPoints[k].winrate);
        if (k===0) ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    // 胜率下万填充
    ctx.lineTo(xOf(maxTurn),yOf(0)); ctx.lineTo(xOf(1),yOf(0)); ctx.closePath();
    ctx.fillStyle = 'rgba(74,157,106,0.08)'; ctx.fill();

    // 当前浏览位置标记
    var curTurn = analyzeMoveIndex;
    if (curTurn >= 1 && curTurn <= maxTurn) {
        var cx = xOf(curTurn);
        var pt = null;
        for (var m=0;m<n;m++) if (wrPoints[m].turn===curTurn) { pt = wrPoints[m]; break; }
        if (pt) {
            ctx.fillStyle = '#e0d5b0';
            ctx.beginPath(); ctx.arc(cx, yOf(pt.winrate), 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#e0d5b0'; ctx.setLineDash([3,3]);
            ctx.beginPath(); ctx.moveTo(cx,padT); ctx.lineTo(cx,H-padB); ctx.stroke();
            ctx.setLineDash([]);
        }
    }

    wrGeom = {padL:padL, pw:pw, maxTurn:maxTurn};
}

// 悬停提示 + 点击跳转
(function(){
    var cv = document.getElementById('winrate-canvas');
    if (!cv) return;
    var locate = function(e) {
        if (!wrPoints || !wrGeom) return null;
        var rect = cv.getBoundingClientRect();
        var x = (e.clientX-rect.left) * (cv.width/rect.width);
        var turn = Math.round(1 + (x-wrGeom.padL)/wrGeom.pw*(wrGeom.maxTurn-1));
        if (turn<1) turn=1; if (turn>wrGeom.maxTurn) turn=wrGeom.maxTurn;
        for (var i=0;i<wrPoints.length;i++) if (wrPoints[i].turn===turn) return wrPoints[i];
        return null;
    };
    cv.addEventListener('mousemove', function(e) {
        var pt = locate(e); var tip = document.getElementById('wr-tip');
        if (!pt) { tip.style.display='none'; return; }
        var mv = analyzeMoveHistory[pt.turn-1];
        var mvTxt = mv ? ((mv.color===1?'黑':'白')+(mv.pass?' Pass':': '+COLS[mv.col]+(boardSize-mv.row))) : '';
        tip.innerHTML = '第 '+pt.turn+' 手 '+mvTxt+'<br>黑胜率 '+pt.winrate+'%（目差 '+pt.scoreLead+'）';
        var rect = cv.getBoundingClientRect();
        tip.style.display = 'block';
        tip.style.left = Math.min(e.clientX-rect.left+14, rect.width-150)+'px';
        tip.style.top = (e.clientY-rect.top-10)+'px';
    });
    cv.addEventListener('mouseleave', function(){ document.getElementById('wr-tip').style.display='none'; });
    cv.addEventListener('click', function(e) {
        var pt = locate(e); if (!pt) return;
        // 跳转到该局面（setMoveIndex 语义：浏览到第 turn 手）
        analyzeMoveIndex = Math.min(pt.turn, analyzeMoveHistory.length);

    });
})();


// ==============================================================
function initAnalyzeBoardData() {
    analyzeBoard = [];
    analyzeBaseBoard = [];
    for (var r=0;r<boardSize;r++) {
        analyzeBoard[r]=[]; analyzeBaseBoard[r]=[];
        for(var c=0;c<boardSize;c++) { analyzeBoard[r][c]=0; analyzeBaseBoard[r][c]=0; }
    }
    analyzeResults = []; clearPinnedPV();
    groupLifeResult = null;
    analyzeNextColor = document.getElementById('next-player') ? document.getElementById('next-player').value : 'B';
    analyzeLastMove = null;
    analyzeMoveHistory = [];
    analyzeMoveIndex = 0;
    analyzeKomi = 6.5;
    updateMoveIndexDisplay();
    updateStoneCount();
}

// 从 baseBoard + history[0..index-1] 重建 analyzeBoard
function rebuildAnalyzeBoard() {
    for (var r=0;r<boardSize;r++) for(var c=0;c<boardSize;c++) analyzeBoard[r][c]=analyzeBaseBoard[r][c];
    for (var i=0;i<analyzeMoveIndex;i++) {
        var mv = analyzeMoveHistory[i];
        if (mv.pass) continue; // Pass 不落子
        analyzeBoard[mv.row][mv.col] = mv.color;
        // 重新执行提子
        if (mv.captured && mv.captured.length>0) {
            for (var j=0;j<mv.captured.length;j++) {
                analyzeBoard[mv.captured[j].row][mv.captured[j].col] = 0;
            }
        }
    }
}

function updateMoveIndexDisplay() {
    var el = document.getElementById('move-index-display');
    if (el) el.textContent = analyzeMoveIndex + '/' + analyzeMoveHistory.length;
}

function analyzeMoveBack() {
    if (analyzeMoveIndex <= 0) return;
    analyzeMoveIndex--;
    rebuildAnalyzeBoard();
    // 更新下一手颜色
    if (analyzeMoveIndex > 0) {
        var lastColor = analyzeMoveHistory[analyzeMoveIndex-1].color;
        analyzeNextColor = (lastColor === 1) ? 'W' : 'B';
    } else {
        inferNextPlayer();
    }
    document.getElementById('next-player').value = analyzeNextColor;
    var lm = analyzeMoveIndex > 0 ? analyzeMoveHistory[analyzeMoveIndex-1] : null;
    analyzeLastMove = (lm && !lm.pass) ? [lm.row, lm.col] : null;
    analyzeResults = []; clearPinnedPV();
    groupLifeResult = null;
    hoveredPVIndex = -1;
    updateMoveIndexDisplay();
    updatePlayModeIndicator();
    updateStoneCount();
    drawBoard();
}

function analyzeMoveForward() {
    if (analyzeMoveIndex >= analyzeMoveHistory.length) return;
    analyzeMoveIndex++;
    rebuildAnalyzeBoard();
    // 更新下一手颜色
    var lastColor = analyzeMoveHistory[analyzeMoveIndex-1].color;
    analyzeNextColor = (lastColor === 1) ? 'W' : 'B';
    document.getElementById('next-player').value = analyzeNextColor;
    var lm = analyzeMoveHistory[analyzeMoveIndex-1];
    analyzeLastMove = lm.pass ? null : [lm.row, lm.col];
    analyzeResults = []; clearPinnedPV();
    groupLifeResult = null;
    hoveredPVIndex = -1;
    updateMoveIndexDisplay();
    updatePlayModeIndicator();
    updateStoneCount();
    drawBoard();
}

function handleAnalyzeClick(row, col) {
if (isAnalyzing) return;

// 死活提示：点击棋子 = 评估该棋块死活，不落子（需先于「有子早退」检查）
if (groupLifeOn) {
groupLifeClick(row, col);
return;
}

if (analyzeBoard[row][col] !== 0) return; // 有子的位置不能下

// 如果当前不在最末尾，截断后面的历史
    if (analyzeMoveIndex < analyzeMoveHistory.length) {
        analyzeMoveHistory = analyzeMoveHistory.slice(0, analyzeMoveIndex);
    }

    var stoneColor = (analyzeNextColor === 'B') ? 1 : 2;
    analyzeBoard[row][col] = stoneColor;
    // 提子逻辑：移除被围死的对方棋子
    var captured = removeCaptures(row, col, stoneColor, analyzeBoard);
    analyzeMoveHistory.push({row: row, col: col, color: stoneColor, captured: captured});
    analyzeMoveIndex = analyzeMoveHistory.length;
    analyzeLastMove = [row, col];
    // 切换下一手颜色
    analyzeNextColor = (analyzeNextColor === 'B') ? 'W' : 'B';
    document.getElementById('next-player').value = analyzeNextColor;
    analyzeResults = []; clearPinnedPV();
    groupLifeResult = null;
    hoveredPVIndex = -1;
    updateMoveIndexDisplay();
    updateStoneCount();
    updatePlayModeIndicator();
    drawBoard();
}

function updateStoneCount() {
    var bc=0, wc=0;
    for (var r=0;r<boardSize;r++) for(var c=0;c<boardSize;c++) {
        if (analyzeBoard[r]&&analyzeBoard[r][c]===1) bc++;
        if (analyzeBoard[r]&&analyzeBoard[r][c]===2) wc++;
    }
    document.getElementById('stone-count').textContent = '黑 '+bc+' 白 '+wc;
}

function inferNextPlayer() {
    // 根据棋盘上黑白子数量自动推断轮到谁走
    var bc=0, wc=0;
    for (var r=0;r<boardSize;r++) for(var c=0;c<boardSize;c++) {
        if (analyzeBoard[r]&&analyzeBoard[r][c]===1) bc++;
        if (analyzeBoard[r]&&analyzeBoard[r][c]===2) wc++;
    }
    // 黑子数 <= 白子数 → 轮到黑走；黑子数 > 白子数 → 轮到白走
    var inferred = (bc <= wc) ? 'B' : 'W';
    document.getElementById('next-player').value = inferred;
    analyzeNextColor = inferred;
}

            } else {

            }
        }).catch(function(err){
            analyzeStatusSet(tok, '识别请求失败: '+err.message);
        });
    };
    reader2.readAsArrayBuffer(file);
}

function arrayBufferToBase64(buffer) {
    var binary = '';
    var bytes = new Uint8Array(buffer);
    for (var i=0;i<bytes.byteLength;i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
}

// ==============================================================
// 分析模块：组装当前局面快照
// stones = 当前棋盘（含摆子与试看落子）；setup_stones = 无顺序摆子底板（截图识别/SGF AB/AW）；
// move_history = 当前浏览位置前的着法序列。三者一并发给后端，
// 由后端决定走 move_history 路径还是 initialStones 路径，前端不感知引擎查询策略。
// ==============================================================
function buildAnalyzeSnapshot() {
    var stones = [], setup = [], mh = [];
    for (var r=0;r<boardSize;r++) for (var c=0;c<boardSize;c++) {
        var g = COLS[c]+String(boardSize-r);
        if (analyzeBoard[r]&&analyzeBoard[r][c]===1) stones.push({color:'B',pos:g});
        else if (analyzeBoard[r]&&analyzeBoard[r][c]===2) stones.push({color:'W',pos:g});
        if (analyzeBaseBoard[r]&&analyzeBaseBoard[r][c]===1) setup.push({color:'B',pos:g});
        else if (analyzeBaseBoard[r]&&analyzeBaseBoard[r][c]===2) setup.push({color:'W',pos:g});
    }
    for (var i=0;i<analyzeMoveIndex;i++) {
        var mv = analyzeMoveHistory[i];
        var cl = (mv.color===1)?'B':'W';
        if (mv.pass) mh.push([cl,'pass']);
        else mh.push([cl, COLS[mv.col]+String(boardSize-mv.row)]);
    }
    return {stones:stones, setup_stones:setup, move_history:mh};
}

// 分析区状态栏响应竞态防护：每次发起新请求领取序号，
// 迟到的过期响应（如识别回调晚于分析）不得覆盖界面状态
var analyzeStatusSeq = 0;
function analyzeStatusBegin() { return ++analyzeStatusSeq; }
function analyzeStatusCurrent() { return analyzeStatusSeq; }
function analyzeStatusSet(tok, html) {
    if (tok === analyzeStatusSeq) document.getElementById('analyze-status').innerHTML = html;
}

// AI 分析
function runAnalysis() {
if (isAnalyzing) return;
var snap = buildAnalyzeSnapshot();
    if (snap.stones.length===0) {
        document.getElementById('analyze-status').innerHTML = '棋盘上没有棋子，请先摆放棋子或粘贴截图';
        return;
    }

    var nextPlayer = document.getElementById('next-player').value;
    var analyzeVisits = parseInt(document.getElementById('analyze-strength').value);
    isAnalyzing = true;
    var tok = analyzeStatusBegin();
    pinnedPVIndex = -1;  // 重新分析时清除固定展开
    document.getElementById('btn-analyze').disabled = true;
    // 根据 visits 档位预估时间
    var estTime = Math.min(Math.round(analyzeVisits / 200) + 5, 60);
    var estDesc = analyzeVisits <= 100 ? '几秒' : analyzeVisits <= 400 ? '约 5-7 秒' : analyzeVisits <= 1600 ? '约 10-15 秒' : analyzeVisits <= 5000 ? '约 20-30 秒' : '约 30-60 秒';
    analyzeStatusSet(tok, '<span class="thinking">AI 分析中... 预计 ' + estDesc + '</span>');

fetch('/api/analyze', {
method:'POST', headers:{'Content-Type':'application/json'},
body: JSON.stringify({stones:snap.stones, setup_stones:snap.setup_stones, next_player:nextPlayer, board_size:boardSize, komi:analyzeKomi, max_visits:analyzeVisits, move_history:snap.move_history})
    }).then(function(r){return r.json();}).then(function(data){
        if (data.status==='ok' && data.recommendations) {
            analyzeResults = data.recommendations;
            analyzeNextColor = nextPlayer;
            updatePlayModeIndicator();
            var html = '<b>Top '+analyzeResults.length+' 推荐走法</b> (轮'+(nextPlayer==='B'?'黑':'白')+'走)<br>';
            for (var i=0;i<analyzeResults.length;i++) {
                var rec = analyzeResults[i];
                var sign = rec.scoreLead >= 0 ? '+' : '';
                html += '<span style="color:'+RANK_COLORS[i]+'">&#9679;</span> ' +
                    '<b>'+(i+1)+'. '+rec.move+'</b>  胜率 '+rec.winrate+'%  ' +
                    '领先 '+sign+rec.scoreLead+'目  ('+rec.visits+'次模拟)<br>';
            }
            html += '<br><span style="color:#f8d76b">➔ 点击棋盘空位落子，再点「AI 分析」查看推荐</span>';
            analyzeStatusSet(tok, html);
            drawBoard();
        } else if (data.status==='superseded') {
            // 已被更新的分析请求取代（后端过期淘汰），静默忽略
        } else {
            analyzeStatusSet(tok, '分析失败: '+(data.error||data.message||'未知'));
        }
        isAnalyzing = false;
        document.getElementById('btn-analyze').disabled = false;
    }).catch(function(err){
        analyzeStatusSet(tok, '分析请求失败: '+err.message);
        isAnalyzing = false;
        document.getElementById('btn-analyze').disabled = false;
    });
}

// ==============================================================
// 落子模式指示器
// ==============================================================
function updatePlayModeIndicator() {
    // 同步 next-player 选择器
    document.getElementById('next-player').value = analyzeNextColor;
}

function onNextPlayerChange() {
    analyzeNextColor = document.getElementById('next-player').value;
    clearPinnedPV();  // 固定 PV 颜色序列对应分析时的轮走方，切换后失真需清除
    updatePlayModeIndicator();
    drawBoard();
}


// ==============================================================
initPlayBoard();
initAnalyzeBoardData();
updatePlayModeIndicator();
drawBoard();
</script>
